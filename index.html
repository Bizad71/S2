<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>BizadShop</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;color:#172033;font-family:Tahoma,Arial,sans-serif}
button,input,select{font:inherit}
button{border:0;cursor:pointer}
.app{max-width:620px;margin:auto;min-height:100vh;padding-bottom:78px}
header{height:62px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #e7e9ed;position:sticky;top:0;z-index:20}
.header-side{width:42px;display:flex;align-items:center;justify-content:center}
.shop-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.connection{width:12px;height:12px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 4px #fee2e2}
.connection.ok{background:#22c55e;box-shadow:0 0 0 4px #dcfce7}
.menu-btn{background:none;font-size:25px;color:#475569;width:40px;height:40px}
main{padding:18px 14px}
.page-title{font-size:22px;font-weight:800;margin:4px 0 18px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 15px rgba(15,23,42,.05)}
.stat-title{font-size:13px;color:#64748b}
.stat-value{font-size:27px;font-weight:800;margin-top:8px}
.add-card{height:145px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#fff}
.add-plus{width:64px;height:64px;border-radius:20px;background:#22c55e;color:#fff;font-size:42px;line-height:1}
.add-text{font-weight:700}
.section-title{font-size:16px;font-weight:800;margin:20px 2px 10px}
.low-title{color:#dc2626}
.low-item,.inventory-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #eef0f3}
.low-item:last-child,.inventory-item:last-child{border-bottom:0}
.item-name{font-weight:700;font-size:14px}
.item-sub{font-size:11px;color:#64748b;margin-top:5px}
.badge{padding:6px 9px;border-radius:10px;background:#fee2e2;color:#dc2626;font-size:12px;font-weight:700}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:#64748b;margin:0 0 7px}
.field input,.field select{width:100%;height:46px;border:1px solid #dfe4ea;border-radius:12px;padding:0 12px;background:#fff;outline:none}
.field input:focus,.field select:focus{border-color:#22c55e}
.row{display:flex;gap:8px}
.row>*{flex:1}
.scan-row{display:flex;gap:8px}
.scan-row input{flex:1}
.scan-btn{width:52px;border-radius:12px;background:#0f172a;color:#fff;font-size:20px}
.primary{width:100%;height:47px;border-radius:13px;background:#16a34a;color:#fff;font-weight:700}
.secondary{width:100%;height:45px;border-radius:12px;background:#e8edf2;color:#334155;font-weight:700}
.danger{background:#fee2e2;color:#dc2626}
.product-card{border:1px solid #e6e9ed;border-radius:15px;padding:14px;margin-top:12px}
.product-head{display:flex;justify-content:space-between;gap:10px}
.price{font-size:17px;font-weight:800}
.stock{font-size:12px;color:#64748b;margin-top:7px}
.qty-row{display:flex;align-items:center;gap:8px;margin-top:12px}
.qty-row input{flex:1;height:43px;border:1px solid #dfe4ea;border-radius:11px;text-align:center}
.qty-btn{width:43px;height:43px;border-radius:11px;background:#eef2f5;font-size:22px}
.cart-row{padding:12px 0;border-bottom:1px solid #edf0f2}
.cart-top{display:flex;justify-content:space-between;font-weight:700}
.cart-bottom{display:flex;justify-content:space-between;color:#64748b;font-size:12px;margin-top:6px}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding:15px 0}
.inventory-actions{display:flex;align-items:center;gap:5px}
.stock-num{min-width:35px;text-align:center;font-weight:800}
.small-btn{width:35px;height:35px;border-radius:10px;background:#eef2f5;font-size:19px}
.delete-btn{background:#fee2e2;color:#dc2626}
.empty{text-align:center;color:#94a3b8;padding:28px 10px}
.bottom{position:fixed;bottom:0;left:0;right:0;max-width:620px;margin:auto;height:68px;background:#fff;border-top:1px solid #e5e7eb;display:grid;grid-template-columns:1fr 1fr 1fr;z-index:30}
.nav-btn{background:#fff;color:#64748b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px}
.nav-btn.active{color:#16a34a;font-weight:800}
.nav-icon{font-size:21px}
.menu{position:fixed;top:59px;right:max(10px,calc((100vw - 620px)/2 + 10px));width:190px;background:#fff;border-radius:15px;box-shadow:0 10px 35px rgba(0,0,0,.16);padding:7px;z-index:50;display:none}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:right;background:#fff;padding:12px;border-radius:10px;color:#334155}
.menu button:hover{background:#f1f5f9}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:60}
.overlay.show{display:flex}
.modal{width:min(620px,100%);background:#fff;border-radius:22px 22px 0 0;padding:18px;max-height:92vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.modal-title{font-size:18px;font-weight:800}
.close{background:#eef2f5;width:38px;height:38px;border-radius:11px;font-size:20px}
.connect-box{padding:14px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:14px;color:#166534;font-size:13px;margin-bottom:14px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:min(430px,100%);background:#fff;padding:22px;border-radius:22px;box-shadow:0 10px 35px rgba(0,0,0,.08)}
.logo{text-align:center;font-size:28px;font-weight:900;margin-bottom:6px}
.login-sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:22px}
.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%) translateY(15px);background:#0f172a;color:#fff;padding:11px 17px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="loginView" class="login">
  <div class="login-card">
    <div class="logo">BizadShop</div>
    <div class="login-sub">مدیریت سریع فروشگاه</div>
    <div class="field">
      <label>نام کاربری</label>
      <input id="loginUsername" autocomplete="username">
    </div>
    <div class="field">
      <label>رمز عبور</label>
      <input id="loginPassword" type="password" autocomplete="current-password">
    </div>
    <button class="primary" id="loginBtn">ورود</button>
    <div style="height:12px"></div>
    <button class="secondary" id="connectLoginBtn">اتصال به دیتابیس</button>
  </div>
</div>

<div id="appView" class="app hidden">
  <header>
    <div class="header-side"><span id="connectionLight" class="connection"></span></div>
    <div id="shopName" class="shop-name">BizadShop</div>
    <div class="header-side"><button id="menuBtn" class="menu-btn">⋮</button></div>
  </header>

  <div id="menu" class="menu">
    <button data-page="home">خانه</button>
    <button data-page="sale">فروش</button>
    <button data-page="inventory">انبار</button>
    <button data-page="settings">تنظیمات</button>
    <button data-page="contact">تماس با ما</button>
  </div>

  <main id="main"></main>

  <nav class="bottom">
    <button class="nav-btn" data-page="sale"><span class="nav-icon">🛒</span><span>فروش</span></button>
    <button class="nav-btn active" data-page="home"><span class="nav-icon">⌂</span><span>خانه</span></button>
    <button class="nav-btn" data-page="inventory"><span class="nav-icon">▤</span><span>انبار</span></button>
  </nav>
</div>

<div id="modalOverlay" class="overlay">
  <div class="modal">
    <div class="modal-head">
      <div id="modalTitle" class="modal-title">ثبت کالا جدید</div>
      <button id="modalClose" class="close">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="main.js"></script>
</body>
</html>
